version: '3.8'

services:
  # 1. 스프링 부트 앱
  app:
    container_name: pixel-war-app
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/pixelwar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_PROFILES_ACTIVE=prod
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
    restart: always

  # 2. MySQL
  mysql:
    container_name: pixel-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pixelwar
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql # 데이터가 날아가지 않게 로컬에 저장
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always

  # 3. Redis
  redis:
    container_name: pixel-redis
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always